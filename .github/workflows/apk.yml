name: APK bauen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  bauen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Tests und APK
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleDebug --stacktrace

      - name: Testberichte sichern
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: testberichte
          path: app/build/reports/

      # Die APK hängt immer am Release "neueste", damit der Download-Link gleich bleibt.
      - name: Als Release veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk ToDo.apk
          gh release delete neueste --yes --cleanup-tag || true
          gh release create neueste ToDo.apk \
            --title "Neueste Version (Build ${{ github.run_number }})" \
            --notes "Automatisch gebaut aus ${{ github.sha }}. Auf dem Handy herunterladen und installieren." \
            --latest
